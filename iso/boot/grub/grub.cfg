# Brainix GRUB2 configuration
#
# GRUB2 loads the bootloader binary as the multiboot2 image. The bootloader
# performs the 32-to-64-bit long mode transition, enables SMEP and SMAP, sets
# up higher-half page tables, and jumps to the kernel entry point at the fixed
# virtual address 0xFFFFFFFF80100000.
#
# The kernel binary is loaded as a multiboot2 module. In Phase 1 the bootloader
# jumps directly to _kernel_start (the fixed address defined in both linker
# scripts). The module tag provides future flexibility so the bootloader can
# discover the kernel load address from the multiboot2 info struct.
#
# This configuration boots immediately with no timeout.

set timeout=0
set default=0

menuentry "Brainix" {
    multiboot2 /boot/brainix-bootloader
    module2 /boot/brainix --kernel
    module2 /boot/init.elf --init
    module2 /boot/spawnd.elf --spawnd
    module2 /boot/auditd.elf --auditd
    module2 /boot/devd-nic.elf --devd-nic
    module2 /boot/devd-disk.elf --devd-disk
    boot
}
