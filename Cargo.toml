[workspace]
members = [
    "src/adt",
    "src/sha256",
    "src/platform-select",
    "src/pcie-config",
    "src/pcie-config-verify",
    "src/aarch64-mmu",
    "src/aarch64-mmu-verify",
    "src/adt-verify",
    "src/bsp",
    "src/bsp-verify",
    "src/transport-crypto",
    "src/transport-crypto-verify",
    "src/bxw1",
    "src/tensor",
    "src/transformer",
    "src/tokenizer",
    "src/kernel",
    "src/bootloader",
    "src/bootloader-verify",
    "src/servers/*",
    "src/inferd-verify",
    "src/auditd-verify",
    "src/dart",
    "src/dart-verify",
    "src/servd-verify",
    "tools/bsp-client",
    "tools/datapath",
    "tools/perf-baseline",
    "src/capability-verify",
    "src/ipc-verify",
    "userland/shell/0.01",
]
exclude = [
    "tools/proof-coverage",
    "tools/bxw1-convert",
    "tools/bxw1-run",
    # AS-1a first-light boot stub. Excluded rather than a member because it
    # builds for aarch64 while this workspace's default target is the frozen
    # x86-64 reference, and nothing here may put that build at risk (#26).
    # See docs/architecture/AS-1a-first-light-boot-stub.md §3.2.
    "src/boot-stub-apple",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"

[workspace.lints.clippy]
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
expect_used = "deny"
arithmetic_side_effects = "deny"
cognitive_complexity = "deny"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
