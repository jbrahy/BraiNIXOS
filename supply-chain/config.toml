
# cargo-vet config file

[cargo-vet]
version = "0.10"

[[exemptions.bit_field]]
version = "0.10.3"
criteria = "safe-to-deploy"

[[exemptions.bitflags]]
version = "2.11.0"
criteria = "safe-to-deploy"

[[exemptions.block-buffer]]
version = "0.10.4"
criteria = "safe-to-deploy"
notes = "SHA-2 block processing buffer. Pure computation, no_std compatible. Part of RustCrypto project (widely audited). Transitive dep of sha2 for PCR[2] measurement (SCHED-05)."

[[exemptions.cfg-if]]
version = "1.0.4"
criteria = "safe-to-deploy"
notes = "Compile-time conditional compilation macro. Pure macro, no runtime code. Transitive dep of sha2 via cpufeatures."

[[exemptions.chacha20]]
version = "0.9.1"
criteria = "safe-to-deploy"
notes = "ChaCha20 stream cipher from RustCrypto. Pure Rust, no_std with default-features = false. Used by the kernel SSH server and by brainix-transport-crypto for the BSP v2 AEAD record layer. Vendored, and on the X-T4 burn-down list."

[[exemptions.cipher]]
version = "0.4.4"
criteria = "safe-to-deploy"
notes = "RustCrypto block/stream cipher traits. Trait definitions and buffer plumbing, no cryptography of its own. Transitive dep of chacha20."

[[exemptions.const_fn]]
version = "0.4.12"
criteria = "safe-to-deploy"

[[exemptions.cpufeatures]]
version = "0.2.17"
criteria = "safe-to-deploy"
notes = "CPU feature detection for runtime dispatch. Used by sha2 for hardware SHA acceleration. Contains platform-specific inline asm for CPUID; no_std compatible."

[[exemptions.crypto-common]]
version = "0.1.7"
criteria = "safe-to-deploy"
notes = "Common traits for RustCrypto crates (BlockSizeUser, OutputSizeUser). Pure trait definitions, no_std compatible. Transitive dep of sha2 for PCR[2] measurement (SCHED-05)."

[[exemptions.curve25519-dalek]]
version = "4.1.3"
criteria = "safe-to-deploy"
notes = "Curve25519 field and group arithmetic backing ed25519-dalek. Permanent named exception under owner decision #18: Ed25519 is verify-only in tree, so this crate, ed25519-dalek, fiat-crypto and subtle are off the X-T4 vendored burn-down list rather than on a path to zero. The serial backend is forced on the bare-metal target because the soft-float ABI of x86_64-unknown-none permits no SIMD."

[[exemptions.curve25519-dalek-derive]]
version = "0.1.1"
criteria = "safe-to-deploy"
notes = "Proc-macro helper for curve25519-dalek. Build-time only, emits no runtime code."

[[exemptions.digest]]
version = "0.10.7"
criteria = "safe-to-deploy"
notes = "Cryptographic hash function traits (Digest, Update, FixedOutput). Pure Rust, no_std compatible. Part of RustCrypto project. Transitive dep of sha2 for PCR[2] measurement (SCHED-05)."

[[exemptions.ed25519]]
version = "2.2.3"
criteria = "safe-to-deploy"
notes = "Ed25519 signature and key type definitions. Types and traits only. Transitive dep of ed25519-dalek."

[[exemptions.ed25519-dalek]]
version = "2.2.0"
criteria = "safe-to-deploy"
notes = "Ed25519 verification. Permanent named exception under owner decision #18: verify-only in tree, and no signing key ever enters a build artifact."

[[exemptions.fiat-crypto]]
version = "0.2.9"
criteria = "safe-to-deploy"
notes = "Field arithmetic for curve25519-dalek, machine-generated by the Fiat proof-producing compiler. Part of the same permanent exception as curve25519-dalek (#18)."

[[exemptions.generic-array]]
version = "0.14.7"
criteria = "safe-to-deploy"
notes = "Generic array type parameterized by typenum length. Pure Rust, no_std compatible. Used by sha2/digest for fixed-size output arrays. Widely used in the Rust ecosystem."

[[exemptions.inout]]
version = "0.1.4"
criteria = "safe-to-deploy"
notes = "In-place / out-of-place buffer wrapper used by cipher for the same. No cryptography of its own. Transitive dep of chacha20."

[[exemptions.libc]]
version = "0.2.185"
criteria = "safe-to-deploy"
notes = "Rust FFI bindings for libc. Only pulled in by cpufeatures for target_os-gated CPUID detection. Not compiled for no_std bare-metal target (x86_64-unknown-none)."

[[exemptions.log]]
version = "0.4.29"
criteria = "safe-to-deploy"

[[exemptions.multiboot2-common]]
version = "0.3.0"
criteria = "safe-to-deploy"

[[exemptions.proc-macro2]]
version = "1.0.106"
criteria = "safe-to-deploy"

[[exemptions.ptr_meta]]
version = "0.3.1"
criteria = "safe-to-deploy"

[[exemptions.ptr_meta_derive]]
version = "0.3.1"
criteria = "safe-to-deploy"

[[exemptions.quote]]
version = "1.0.45"
criteria = "safe-to-deploy"

[[exemptions.rustc_version]]
version = "0.4.1"
criteria = "safe-to-deploy"
notes = "Build-script-only rustc version detection, used by curve25519-dalek to select its backend. No runtime code."

[[exemptions.rustversion]]
version = "1.0.22"
criteria = "safe-to-deploy"

[[exemptions.semver]]
version = "1.0.28"
criteria = "safe-to-deploy"
notes = "Semantic-version parsing, reached only from rustc_version in a build script. No runtime code."

[[exemptions.sha2]]
version = "0.10.9"
criteria = "safe-to-deploy"
notes = "SHA-256 implementation from RustCrypto project. Pure Rust, no_std compatible (default-features = false). Required for TPM PCR[2] partition table measurement (SCHED-05). MIT/Apache-2.0 licensed. Widely audited cryptographic library."

[[exemptions.signature]]
version = "2.2.0"
criteria = "safe-to-deploy"
notes = "Signature trait definitions used by ed25519 and ed25519-dalek. Traits only."

[[exemptions.subtle]]
version = "2.6.1"
criteria = "safe-to-deploy"
notes = "Constant-time comparison and selection primitives. Part of the permanent exception (#18), and the reason comparison on secret material is not a branch."

[[exemptions.syn]]
version = "2.0.117"
criteria = "safe-to-deploy"

[[exemptions.thiserror]]
version = "2.0.18"
criteria = "safe-to-deploy"

[[exemptions.thiserror-impl]]
version = "2.0.18"
criteria = "safe-to-deploy"

[[exemptions.typenum]]
version = "1.19.0"
criteria = "safe-to-deploy"
notes = "Type-level numbers for Rust. Pure computation at the type level, no runtime overhead. Used by generic-array for fixed-size array parameterization. Transitive dep of sha2."

[[exemptions.uefi-raw]]
version = "0.12.0"
criteria = "safe-to-deploy"

[[exemptions.uguid]]
version = "2.2.1"
criteria = "safe-to-deploy"

[[exemptions.unicode-ident]]
version = "1.0.24"
criteria = "safe-to-deploy"

[[exemptions.version_check]]
version = "0.9.5"
criteria = "safe-to-deploy"
notes = "Compile-time Rust version checking. Build-script-only crate, no runtime code. Used by generic-array for conditional compilation based on Rust version."

[[exemptions.volatile]]
version = "0.4.6"
criteria = "safe-to-deploy"
