# cargo-deny configuration for BraiNIX
# Only check dependencies for the bare-metal target.

[graph]
targets = [{ triple = "x86_64-unknown-none" }]

[licenses]
# AGPL-3.0-only is BraiNIX's own license. Workspace members are still license-checked
# because they do not set `publish = false`, which is what `private.ignore` keys off.
allow = ["AGPL-3.0-only", "MIT", "Apache-2.0", "BSD-3-Clause", "Unicode-3.0"]
private = { ignore = true }

[bans]
multiple-versions = "warn"

[advisories]
ignore = []
