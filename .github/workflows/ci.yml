name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # 0. Style gate — fastest feedback, runs first
  # ---------------------------------------------------------------------------
  style:
    name: Style Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned nightly)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-01
          components: rustfmt, clippy, rust-src

      - name: cargo check (bare-metal crates)
        run: cargo check -p brainix-kernel -p brainix-bootloader --features brainix-kernel/kernel-binary --target x86_64-unknown-none

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (bare-metal target)
        run: cargo clippy -p brainix-kernel -p brainix-bootloader --features brainix-kernel/kernel-binary --target x86_64-unknown-none -- -D warnings

      # --target is REQUIRED and its absence is why this step failed with
      # "can't find crate for `std`" on brainix-adt-verify.
      #
      # .cargo/config.toml sets `build.target = "x86_64-unknown-none"`, so a
      # cargo invocation with no --target builds bare metal, not host. This step
      # therefore was not a host run at all: it re-checked the excluded crates'
      # dependencies against a target with no std, and the first std crate in
      # the workspace -- adt-verify -- could not compile. Naming the runner's
      # own triple makes the step do what it says.
      # Clippy being green is a fact about today. This is the one that makes it
      # a fact about tomorrow: every `allow(clippy::...)` in the tree must sit
      # in the frozen x86-64 reference or in a named file that says why, so the
      # suppression set cannot grow while the job keeps passing. A lint that is
      # green because everything noisy is suppressed is a lint nobody runs.
      - name: Clippy suppressions stay accounted for
        run: ./bin/lint-suppressions.py

      - name: cargo clippy (host target)
        run: cargo clippy --workspace --exclude brainix-capability-verify --exclude brainix-kernel --exclude brainix-bootloader --exclude brainix-ipc-verify --exclude brainix-bootloader-verify --target x86_64-unknown-linux-gnu -- -D warnings

  # ---------------------------------------------------------------------------
  # 1. Supply chain audit — runs after style gate
  # ---------------------------------------------------------------------------
  supply-chain:
    name: Supply Chain Audit
    runs-on: ubuntu-latest
    needs: [style]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (nightly, pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-01
          components: rust-src

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Install cargo-vet
        uses: taiki-e/install-action@cargo-vet

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: cargo deny (license + advisories)
        run: cargo deny check

      - name: cargo vet (trusted audits)
        run: cargo vet

      - name: cargo audit (CVE check)
        run: cargo audit

  # ---------------------------------------------------------------------------
  # 2. Unit tests — runs on host (std), covers capability/IPC logic
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: supply-chain
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-01
          components: rust-src

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-unit-${{ hashFiles('**/Cargo.lock') }}

      # Both steps name the runner's own triple for the same reason the style
      # job's host clippy step does: .cargo/config.toml sets
      # `build.target = "x86_64-unknown-none"`, so a bare `cargo test` builds a
      # std test harness for a target with no std and never runs a test.
      - name: Run capability-verify unit tests (hosted Kani shim)
        run: cargo test -p brainix-capability-verify --target x86_64-unknown-linux-gnu --verbose

      - name: Run kernel security boot tests (host target)
        run: cargo test -p brainix-kernel --target x86_64-unknown-linux-gnu --verbose

  # ---------------------------------------------------------------------------
  # 3. Kernel cross-compile — verifies no_std bare-metal build
  # ---------------------------------------------------------------------------
  kernel-build:
    name: Kernel Cross-Compile
    runs-on: ubuntu-latest
    needs: supply-chain
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (nightly + x86_64-unknown-none)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-01
          targets: x86_64-unknown-none
          components: rust-src, llvm-tools-preview

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-kernel-${{ hashFiles('**/Cargo.lock') }}

      - name: Build kernel (bare metal)
        working-directory: src/kernel
        run: cargo build --target x86_64-unknown-none --release --features kernel-binary

      - name: Build bootloader
        working-directory: src/bootloader
        run: cargo build --target x86_64-unknown-none --release

  # ---------------------------------------------------------------------------
  # 3b. Line coverage — the ratchet toward 100% on the covered set
  #
  # Distinct from tools/proof-coverage/, which tracks INVARIANT coverage (which
  # of the eight headline invariants have Kani proofs). This measures whether
  # tests actually execute the code. Both are required; neither substitutes for
  # the other.
  # ---------------------------------------------------------------------------
  coverage:
    name: Line Coverage
    runs-on: ubuntu-latest
    needs: supply-chain
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned nightly)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-01
          components: rust-src, llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Coverage gate
        run: ./bin/coverage-gate.py

  # ---------------------------------------------------------------------------
  # 3d. Reproducible build — INV-BOOT's first clause (X-T3)
  #
  # "A third party can rebuild the published payload bit-for-bit" is one of the
  # four things INV-BOOT still means on this platform, and the only one of the
  # four that can be checked without hardware. A release whose payload is not
  # reproducible cannot honestly carry the signature the other clause requires:
  # the signed artifact and the published source would describe different
  # objects.
  #
  # This builds twice into unrelated target directories and compares bytes. It
  # runs on every pull request rather than at release time, because a build that
  # became irreproducible in March is cheapest to find in March.
  # ---------------------------------------------------------------------------
  reproducible-build:
    name: Reproducible Build
    runs-on: ubuntu-latest
    needs: supply-chain
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned nightly + bare-metal target)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-01
          targets: x86_64-unknown-none
          components: rust-src

      - name: Build the payload twice and compare
        run: ./bin/reproducible-build.sh

  # ---------------------------------------------------------------------------
  # 3c. Fuzz smoke — the eleven targets that have never executed
  #
  # `INV-PARSE-002` requires every hostile-input parser to ship a fuzz target
  # *and* a Kani harness, and this repository has shipped eleven targets with
  # checked-in corpora that no job has ever run. Every "fuzz soak" criterion in
  # docs/ROADMAP.md -- including on tasks marked DONE -- has therefore been
  # unmet since it was written. This job is P2-T10.
  #
  # It is a smoke test, and the name is meant literally: twenty seconds per
  # target, seeded by the checked-in corpus, is enough to catch a target that
  # crashes on its own corpus or on trivially reachable input. It is not a soak
  # and nothing may cite it as one.
  # ---------------------------------------------------------------------------
  fuzz-smoke:
    name: Fuzz Smoke
    runs-on: ubuntu-latest
    needs: supply-chain
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned nightly)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-01
          components: rust-src, llvm-tools-preview

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@cargo-fuzz

      - name: Fuzz every target, twenty seconds each
        working-directory: fuzz
        run: |
          set -o pipefail
          failed=""
          for target in $(cargo fuzz list); do
            echo "=============== ${target} ==============="
            # -timeout=10 turns a hanging input into a reported crash rather
            # than a silent stall that only the job timeout would catch.
            if ! cargo fuzz run "${target}" -- -max_total_time=20 -timeout=10; then
              echo "FAIL: ${target}"
              failed="${failed} ${target}"
            fi
          done
          if [ -n "${failed}" ]; then
            echo "fuzz smoke failed for:${failed}"
            exit 1
          fi
          echo "fuzz smoke: every target survived its corpus and twenty seconds"

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 4. Formal verification — Kani on the capability-verify and adt-verify crates
  # ---------------------------------------------------------------------------
  # One job per proof package, run in parallel, rather than six `cargo kani`
  # steps in a row.
  #
  # Two reasons, both learned from run 31721650927. Sequentially, one harness
  # that does not converge starves every package behind it: that run spent
  # twenty-seven minutes inside a single ADT harness and never reached the BSP,
  # transport-crypto or IPC proofs at all, so a green-looking backlog of work
  # was simply never checked. And the failure it did produce read "the runner
  # has received a shutdown signal", which looks like infrastructure rather
  # than proof cost.
  #
  # Split, each package gets its own runner and its own clock, `fail-fast:
  # false` lets the others finish and report, and the job name says which
  # package the timeout belongs to.
  kani:
    name: Kani Verification (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The capability model, including the serving-era types (P2-T5).
          - name: capability
            args: --package brainix-capability-verify
          # The Apple Device Tree decoder (AS-0-T3).
          - name: adt
            args: --package brainix-adt-verify
          # The no-allocation harness installs a global allocator, so it runs
          # on its own. See src/adt-verify/src/lib.rs for why it is gated.
          - name: adt-no-allocation
            args: >-
              --package brainix-adt-verify --features deny-allocation
              --harness adt_decoder_performs_no_allocation
          # The two network-facing crates: the BSP v2 wire decoder and the PSK
          # key schedule plus AEAD record layer. Both are Full tier under
          # SECURITY_INVARIANTS.md §16 and are the outermost attack surface in
          # the system.
          - name: bsp
            args: --package brainix-bsp-verify
          - name: transport-crypto
            args: --package brainix-transport-crypto-verify
          # Replaces the former Prusti job. That job pointed at
          # src/brainix-ipc-core/, a shim whose contracts were tautologies about
          # a hand-written copy of the IPC path that nothing in the tree called
          # -- and which had never once executed, because its annotations gated
          # on a feature its manifest never declared. These harnesses run
          # against the real perform_rendezvous.
          - name: ipc
            args: --package brainix-ipc-verify
          # The confined tenant's KV binding, over a symbolic slot rather than
          # the eight the tests walk: the failure mode is one tenant reading
          # another's cache, and a test over the values we expect cannot see a
          # value we did not.
          - name: inferd
            args: --package brainix-inferd-verify
          # The audit record: bounded pressure, and a decode that refuses over
          # every 23-byte string rather than assembling an event from one.
          - name: auditd
            args: --package brainix-auditd-verify
          # INV-DEV-006, and precondition 2 of the five that gate loading Apple's
          # GPU firmware. A claim about an API surface, so it is provable years
          # before the firmware, the hardware, or `gpud` exists.
          - name: dart
            args: --package brainix-dart-verify
          # Bounded admission (INV-SERVE-003) over an arbitrary interleaving of
          # acquire, release and expire, rather than the boundaries a test
          # author thought to walk.
          - name: servd
            args: --package brainix-servd-verify
    steps:
      # Kani is installed BEFORE checkout, deliberately.
      #
      # This repository's .cargo/config.toml sets
      #   [source.crates-io] replace-with = "vendored-sources"
      # and cargo honours that from the working directory. So installing Kani
      # from inside the checkout fails with:
      #   "crates-io is replaced with non-remote-registry source dir .../vendor"
      # which is what model-checking/kani-github-action@v1 was doing on every
      # one of its five invocations, and why it then reported "The version of
      # Kani installed was different than the one requested".
      #
      # Running the install in a directory with no cargo config sidesteps it,
      # and installs Kani exactly once rather than five times. Verification
      # itself runs fine inside the checkout with the vendored config in place
      # -- only the install is affected.
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Kani (outside the checkout, see comment above)
        run: |
          cargo install --locked kani-verifier
          cargo kani setup

      - uses: actions/checkout@v4

      - name: Kani — ${{ matrix.name }}
        run: cargo kani ${{ matrix.args }}

  # ---------------------------------------------------------------------------
  # 5. QEMU integration test — boots kernel, asserts serial output
  # ---------------------------------------------------------------------------
  integration-test:
    name: QEMU Integration Test
    runs-on: ubuntu-latest
    needs: [kernel-build, kani]
    steps:
      - uses: actions/checkout@v4

      # mtools and dosfstools are REQUIRED and their absence is why this job
      # failed with "grub-mkrescue: error: `mformat` invocation failed".
      #
      # grub-mkrescue builds a hybrid ISO with an EFI System Partition inside
      # it, and it shells out to mformat (mtools) to lay down the FAT image and
      # to mkfs.vfat (dosfstools) behind it. Neither is a dependency of
      # grub-common on ubuntu-latest, and grub-mkrescue reports the failure as
      # one line about mformat rather than as a missing package.
      - name: Install QEMU + swtpm + GRUB2 ISO tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qemu-system-x86 \
            swtpm \
            swtpm-tools \
            ovmf \
            grub-pc-bin \
            grub-common \
            xorriso \
            mtools \
            dosfstools

      - name: Install Rust (nightly + x86_64-unknown-none)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-01
          targets: x86_64-unknown-none
          components: rust-src

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-integration-${{ hashFiles('**/Cargo.lock') }}

      # `dev-build`, and this job is the reason the feature exists.
      #
      # A production kernel treats a failed TPM2_Quote at the attestation gate
      # as a fatal halt -- D-22 and INV-BOOT-002, no fallback to unattested
      # operation, ever. No attestation key is provisioned in this test (that
      # is a separate, larger milestone), so the quote fails and the gate does
      # exactly what it is built to do: it halts, before "boot complete" is
      # printed. This job asserted a banner that a production kernel is
      # designed never to reach.
      #
      # With `dev-build` the gate logs a warning and continues, and the dev
      # flag surfaces in PCR[1], so the image says of itself that it is not a
      # production one. docker/test.sh -- the harness that has actually booted
      # this kernel -- builds with the same two features.
      #
      # The Kernel Cross-Compile job deliberately does NOT set it: the
      # production build must keep compiling, and that job is what proves it.
      - name: Build kernel
        working-directory: src/kernel
        run: cargo build --target x86_64-unknown-none --release --features kernel-binary,dev-build

      - name: Build bootloader
        working-directory: src/bootloader
        run: cargo build --target x86_64-unknown-none --release

      - name: Build shell
        run: cargo build -p brainix-shell --target x86_64-unknown-none --release

      # The kernel and the shell are multiboot2 MODULES, and this step used to
      # ship neither.
      #
      # It copied `brainix-bootloader` alone and wrote a grub.cfg with a single
      # `multiboot2` line, so the ISO contained a bootloader with nothing to
      # load: `[BOOT] no kernel module` and a halt is the best case. The job
      # could not have passed at any point in its history, and the `-serial
      # stdio` defect above kept that invisible by discarding whatever the
      # bootloader had to say about it.
      #
      # `module2`, not `module`: with multiboot2 loaded, GRUB's `module`
      # command loads multiboot.mod -- the Multiboot 1 implementation -- and
      # fails with "you need to load the kernel first". docker/test.sh carries
      # the same note and the same three lines.
      - name: Create GRUB2 boot ISO
        run: |
          mkdir -p iso/boot/grub
          cp target/x86_64-unknown-none/release/brainix-bootloader iso/boot/
          cp target/x86_64-unknown-none/release/brainix iso/boot/kernel.elf
          cp target/x86_64-unknown-none/release/brainix-shell iso/boot/shell.elf
          cat > iso/boot/grub/grub.cfg << 'GRUBEOF'
          serial --unit=0 --speed=115200
          terminal_output serial console
          terminal_input serial console
          set timeout=0
          menuentry "BraiNIX" {
              multiboot2 /boot/brainix-bootloader
              module2 /boot/kernel.elf kernel
              module2 /boot/shell.elf shell
              boot
          }
          GRUBEOF
          grub-mkrescue -o brainix.iso iso/

      # No --create-ek-cert / --create-platform-cert, deliberately.
      #
      # Those two are the only flags that invoke swtpm_localca, which writes
      # its CA state to /var/lib/swtpm-localca -- a root-owned directory on
      # ubuntu-latest. It failed with "Need read/write rights on statedir
      # /var/lib/swtpm-localca for user runner", and the message that followed
      # it, "Error getting next filename: No child processes", made it look
      # like a swtpm bug rather than a permissions one.
      #
      # Nothing here needs them. The certificates exist so that a *remote*
      # verifier can chain an EK to a manufacturer CA; this job asserts a
      # serial banner after a measured boot, and BraiNIX does no remote
      # attestation on any platform (owner decision #24). docker/test.sh, the
      # harness that has actually booted this kernel, uses `--createek
      # --overwrite` and nothing else; this now matches it.
      - name: Initialize swtpm (clean state)
        run: |
          rm -rf /tmp/swtpm-test
          mkdir -p /tmp/swtpm-test
          swtpm_setup \
            --tpm2 \
            --tpmstate /tmp/swtpm-test \
            --createek \
            --decryption \
            --lock-nvram \
            --overwrite
          # ONE socket, and it is the CONTROL socket -- the arrangement the
          # QEMU manual documents and the only one that works.
          #
          # QEMU's `-tpmdev emulator` does not send TPM commands over the
          # chardev. It speaks swtpm's control protocol on it and hands the
          # emulator a data fd with CMD_SET_DATAFD. Pointing the chardev at a
          # `--server` socket therefore talks control protocol to a data
          # socket: QEMU blocks in the handshake before starting the CPU, and
          # the job times out with every log empty -- no serial, no SeaBIOS, no
          # guest instruction ever executed. That is what this job did on every
          # run it ever made.
          #
          # Declaring `--server` as well is not harmless either: swtpm then
          # refuses the fd handoff with "Failed to send CMD_SET_DATAFD", which
          # at least fails loudly. Neither socket is needed by anything else
          # here, so there is one.
          swtpm socket \
            --tpm2 \
            --tpmstate dir=/tmp/swtpm-test \
            --ctrl type=unixio,path=/tmp/swtpm-test.sock \
            --flags not-need-init,startup-clear \
            --daemon

      # Every flag here is the residue of a defect this job actually had, and
      # the whole step is built so the next one names itself.
      #
      #   * `-serial file:` -- serial output cannot be lost to a pipe or a
      #     signal. Piping `-nographic` into `tee` conflated the guest's serial
      #     port with the emulator's diagnostics and then lost both, which is
      #     why this job's log was zero bytes on every run in its history.
      #   * NOT `-nographic` with `-serial stdio` -- `-nographic` already routes
      #     serial to stdio, so naming stdio again makes two character devices
      #     claim it and QEMU exits before executing an instruction.
      #   * `+rdrand,+rdseed` -- the kernel seeds its CSPRNG from RDRAND.
      #   * `-debugcon` on 0x402 -- SeaBIOS's own log. "No bootable device" is
      #     otherwise written to a VGA console nothing captures, and is
      #     indistinguishable from a kernel that booted silently.
      #   * `-d guest_errors,cpu_reset` -- a triple fault dumps the register
      #     state that caused it instead of exiting quietly.
      #   * the exit code is reported, not swallowed: 124 means the guest ran
      #     the full timeout, 0 means QEMU exited on its own, and with
      #     `-no-reboot` those are different bugs.
      #
      # Two boot paths are attempted because they are not equivalent across
      # QEMU/SeaBIOS versions: an IDE disk with `-boot order=c`, which is what
      # docker/test.sh uses and what boots this ISO locally, and a CD-ROM with
      # `-boot order=d`, which is the canonical form for a grub-mkrescue image.
      # The second runs only if the first produced no banner.
      - name: Boot kernel in QEMU (headless, 30s per attempt)
        timeout-minutes: 4
        run: |
          ls -l brainix.iso
          boot() {
            local label="$1"; shift
            echo "===================== attempt: ${label} ====================="
            : > /tmp/boot.log; : > /tmp/bios.log; : > /tmp/qemu-debug.log
            local rc=0
            timeout 30 qemu-system-x86_64 \
              "$@" \
              -machine q35,accel=tcg \
              -cpu qemu64,+smep,+smap,+rdrand,+rdseed \
              -m 512M \
              -display none \
              -no-reboot \
              -serial file:/tmp/boot.log \
              -debugcon file:/tmp/bios.log \
              -global isa-debugcon.iobase=0x402 \
              -device virtio-net-pci,netdev=net0 \
              -netdev user,id=net0 \
              -chardev socket,id=chrtpm,path=/tmp/swtpm-test.sock \
              -tpmdev emulator,id=tpm0,chardev=chrtpm \
              -device tpm-tis,tpmdev=tpm0 \
              -d guest_errors,cpu_reset -D /tmp/qemu-debug.log \
              > /tmp/qemu.log 2>&1 || rc=$?
            echo "--- qemu exit code: ${rc}  (124 = ran to the timeout)"
            echo "--- qemu stdout/stderr:"; cat /tmp/qemu.log
            echo "--- firmware (SeaBIOS), last 30 lines:"; tail -30 /tmp/bios.log || true
            echo "--- guest errors / cpu resets, first 60 lines:"; head -60 /tmp/qemu-debug.log || true
            echo "--- serial ($(wc -c < /tmp/boot.log) bytes):"; cat /tmp/boot.log
            grep -q "BraiNIX: boot complete" /tmp/boot.log
          }
          boot "IDE disk, boot order=c" -drive file=brainix.iso,format=raw,if=ide -boot order=c \
            || boot "CD-ROM, boot order=d" -cdrom brainix.iso -boot order=d

      - name: Assert boot success
        run: |
          grep -q "BraiNIX: boot complete" /tmp/boot.log || \
            (echo "FAIL: boot complete message not found" && exit 1)
          echo "PASS: kernel booted successfully"

      - name: Upload boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-log
          path: |
            /tmp/boot.log
            /tmp/qemu.log
            /tmp/qemu-debug.log
            /tmp/bios.log

  # ---------------------------------------------------------------------------
  # 6. Security scan — CVE results to GitHub Security tab
  # ---------------------------------------------------------------------------
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      # `contents: read` is REQUIRED here and its absence is why this job failed
      # with "fatal: repository 'https://github.com/jbrahy/BraiNIX/' not found".
      #
      # Declaring a `permissions:` block REPLACES the default permission set
      # rather than adding to it. Listing only `security-events: write` therefore
      # dropped `contents: read`, leaving GITHUB_TOKEN unable to clone a private
      # repository -- and this repository is private. The error reads like the
      # repo is missing; it actually means the token could not see it.
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-01

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo audit
        run: cargo audit --json > audit-results.json || true

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cargo-audit-results
          path: audit-results.json
