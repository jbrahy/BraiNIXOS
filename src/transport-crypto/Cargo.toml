[package]
name = "brainix-transport-crypto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "BSP v2 PSK key schedule, HKDF ratchet, and ChaCha20-Poly1305 record protection (P2-T2)"

[dependencies]
# Structure only: this crate consumes the P2-T3 decoder rather than re-parsing
# the wire. `brainix-bsp` holds no key material and has no dependencies.
brainix-bsp = { path = "../bsp" }

# HMAC-SHA256, HKDF-SHA256 and Poly1305 were always in-tree here
# (`hmac.rs`, `hkdf.rs`, `poly1305.rs`). What follows is the burn-down of the
# two primitives that were not.
#
# SHA-256 is in-tree as of X-T4. `sha2` is gone from this crate entirely --
# not demoted to a test oracle, because `brainix-sha256` carries its own
# FIPS 180-4 vectors and an oracle that is never wrong proves nothing.
brainix-sha256 = { path = "../sha256" }

# Still vendored: the record layer needs ChaCha20's **64-bit-nonce** variant
# (`chacha20-poly1305@openssh.com`, BSP v2 4.2), and `brainix-chacha20`
# currently implements only RFC 8439's 96-bit-nonce construction. Different
# state layout, not interchangeable. See ROADMAP Track B, B2.
chacha20 = { version = "0.9", default-features = false }
subtle = { version = "2.6", default-features = false }

[dev-dependencies]
# The RFC 8439 AEAD known-answer test composes the 96-bit-nonce ChaCha20 with
# this crate's Poly1305, so the vendored cipher is checked against the RFC
# rather than only against itself.
chacha20 = { version = "0.9", default-features = false }

[lints]
workspace = true
