[package]
name = "brainix-ipc-verify"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Kani proof harnesses for the IPC rendezvous path (INV-IPC-002, INV-IPC-005, INV-AUTH-003)"
publish = false

# Replaces brainix-ipc-core, the Prusti shim. That crate verified a hand-written
# COPY of three IPC ideas -- nothing depended on it, the kernel never called it,
# and its contracts were tautologies of the form "a function that returns Ok
# exactly when P, returns Ok only when P".
#
# These harnesses run against the real `perform_rendezvous` in
# src/kernel/src/ipc/rendezvous.rs instead.

[dependencies]
brainix-kernel = { path = "../kernel" }

[lints]
workspace = true
