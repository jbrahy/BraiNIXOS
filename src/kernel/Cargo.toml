[package]
name = "brainix-kernel"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "brainix"
path = "src/main.rs"
required-features = ["kernel-binary"]

[features]
# Enables the kernel binary target. Required for bare-metal builds.
# Not enabled during host-target `cargo test` runs (security_boot_tests).
kernel-binary = []
# Marks the binary as a development build. Dev binaries are rejected by the
# production verifier even if the Ed25519 signature is valid (D-19, INV-BOOT-003).
# Build: cargo build --features dev-build (development)
# Default (no flag): production build
dev-build = []

[dependencies]
# Shared syscall ABI types: ProcessType enum, syscall number constants, server VA layout.
# Single definition per D-09 -- kernel and server crates share this crate at compile time.
brainix-libsyscall = { path = "../servers/libsyscall" }
# force-soft disables SIMD/cpufeatures runtime detection -- required for x86_64-unknown-none
# (soft-float ABI; hardware SIMD instructions cannot be emitted).
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
chacha20 = { version = "0.9", default-features = false }
ed25519-dalek = { version = "2", default-features = false }
curve25519-dalek = { version = "4", default-features = false }

# Bare-metal x86-64 ONLY -- note `target_os = "none"`, which is load-bearing.
#
# Gating on `target_arch = "x86_64"` alone was wrong in a way that only showed up
# off this machine: on an x86_64 *hosted* target (the Linux CI runner, or
# x86_64-apple-darwin) that cfg is also true, so host verification builds pulled
# in crates that only make sense on bare metal. That broke the Kani job outright
# -- Kani ships its own, newer nightly, and vendored `x86_64` 0.15.4 uses the
# unstable `Step` trait, which moved to `core::range::Step`. Every Kani harness in
# the repository was failing as a result, which is the project's entire evidence
# model.
#
# It stayed invisible locally because this workstation is aarch64, where
# `target_arch = "x86_64"` is false and the crates were already excluded.
#
# `instructions` and `abi_x86_interrupt` are meaningless in a hosted build, so
# excluding them there is correct on its own terms, not merely a CI workaround.
[target.'cfg(all(target_arch = "x86_64", target_os = "none"))'.dependencies]
x86_64 = { version = "0.15.4", default-features = false, features = ["instructions", "abi_x86_interrupt"] }
multiboot2 = { version = "0.24.1", default-features = false }

[lints]
workspace = true
