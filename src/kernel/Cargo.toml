[package]
name = "brainix-kernel"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "brainix"
path = "src/main.rs"
required-features = ["kernel-binary"]

[features]
# Enables the kernel binary target. Required for bare-metal builds.
# Not enabled during host-target `cargo test` runs (security_boot_tests).
kernel-binary = []
# Marks the binary as a development build. Dev binaries are rejected by the
# production verifier even if the Ed25519 signature is valid (D-19, INV-BOOT-003).
# Build: cargo build --features dev-build (development)
# Default (no flag): production build
dev-build = []

[dependencies]
# force-soft disables SIMD/cpufeatures runtime detection -- required for x86_64-unknown-none
# (soft-float ABI; hardware SIMD instructions cannot be emitted).
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
chacha20 = { version = "0.9", default-features = false }
ed25519-dalek = { version = "2", default-features = false }

[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64 = { version = "0.15.4", default-features = false, features = ["instructions", "abi_x86_interrupt"] }
multiboot2 = { version = "0.24.1", default-features = false }

[lints]
workspace = true
