[package]
name = "brainix-kernel"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "brainix"
path = "src/main.rs"
required-features = ["kernel-binary"]

[features]
# Enables the kernel binary target. Required for bare-metal builds.
# Not enabled during host-target `cargo test` runs (security_boot_tests).
kernel-binary = []
# Marks the binary as a development build. Dev binaries are rejected by the
# production verifier even if the Ed25519 signature is valid (D-19, INV-BOOT-003).
# Build: cargo build --features dev-build (development)
# Default (no flag): production build
dev-build = []
# Enlarges the SMP memory-rate buffer to 64 MiB, which is the size the
# concurrent-read measurement needs and a size a BOOT OBJECT must not carry.
#
# The buffer lives in `.bss`, and `.bss` is not in the flat image: the kernel
# zeroes it at entry, past whatever address the loader chose. Under m1n1 that
# was fine because the probe allocated the whole span first. Entered by iBoot
# nothing has reserved it, so 64 MiB of `.bss` means writing 64 MiB of zeroes
# over firmware structures -- including the very `boot_args` and device tree the
# next few lines go on to read.
#
# So the boot image gets 64 KiB and the probe asks for the big one.
smp-bench = []

# Test-only, and deliberately so. `KV_PARTITION_COUNT` must equal
# `brainix_bsp::MAX_SESSIONS` -- admission handing out more sessions than there
# are KV partitions would be sessions with nowhere to put their cache -- and two
# integers that must agree in two crates agree by accident until something
# checks. A dev-dependency checks it without putting the serving-protocol crate
# in the shipped kernel: dev-dependencies are not built for a non-test build, so
# the bare-metal image is byte-identical.
[dev-dependencies]
brainix-bsp = { path = "../bsp" }

[dependencies]
# Shared syscall ABI types: ProcessType enum, syscall number constants, server VA layout.
# Single definition per D-09 -- kernel and server crates share this crate at compile time.
brainix-libsyscall = { path = "../servers/libsyscall" }
# force-soft disables SIMD/cpufeatures runtime detection -- required for x86_64-unknown-none
# (soft-float ABI; hardware SIMD instructions cannot be emitted).
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
chacha20 = { version = "0.9", default-features = false }
ed25519-dalek = { version = "2", default-features = false }
curve25519-dalek = { version = "4", default-features = false }

# Bare-metal aarch64 ONLY -- AS-1c.
#
# `target_os = "none"` matters here for the same reason it does below: on a
# hosted aarch64 target (this workstation) the arch predicate is also true, and
# a host verification build has no business pulling in a boot stub.
#
# This is our own crate, not an external dependency, so it does not touch
# NORTH_STAR's hard line on adding crates. It carries the DockChannel driver and
# the ADT console discovery that were verified on the target machine on
# 2026-08-16 -- reusing them is the difference between an aarch64 backend that
# has been run and one that has been written.
# brainix-adt is NOT target-gated, unlike the boot stub below.
#
# It is a pure no_std crate whose own tests run on the host, and the pure ADT
# code in this crate (aarch64_devices) needs it to be host-testable at all.
# Gating it would put the device lookup back where it started: correct-looking,
# and untested against the tree it actually parses. The gate below exists
# because a host build has no business compiling a boot stub; that reasoning
# does not extend to a byte-slice parser.
brainix-adt = { path = "../adt" }

[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
brainix-boot-stub-apple = { path = "../boot-stub-apple" }

# Bare-metal x86-64 ONLY -- note `target_os = "none"`, which is load-bearing.
#
# Gating on `target_arch = "x86_64"` alone was wrong in a way that only showed up
# off this machine: on an x86_64 *hosted* target (the Linux CI runner, or
# x86_64-apple-darwin) that cfg is also true, so host verification builds pulled
# in crates that only make sense on bare metal. That broke the Kani job outright
# -- Kani ships its own, newer nightly, and vendored `x86_64` 0.15.4 uses the
# unstable `Step` trait, which moved to `core::range::Step`. Every Kani harness in
# the repository was failing as a result, which is the project's entire evidence
# model.
#
# It stayed invisible locally because this workstation is aarch64, where
# `target_arch = "x86_64"` is false and the crates were already excluded.
#
# `instructions` and `abi_x86_interrupt` are meaningless in a hosted build, so
# excluding them there is correct on its own terms, not merely a CI workaround.
[target.'cfg(all(target_arch = "x86_64", target_os = "none"))'.dependencies]
x86_64 = { version = "0.15.4", default-features = false, features = ["instructions", "abi_x86_interrupt"] }
multiboot2 = { version = "0.24.1", default-features = false }

[lints]
workspace = true
