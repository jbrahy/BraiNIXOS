[package]
name = "brainix-bsp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Fail-closed, zero-allocation BSP v2 wire-protocol decoder and response encoder (P2-T3)"

[dependencies]
# None, and none may be added. This crate decodes structure only; the four
# primitives BSP uses (SHA-256, HKDF, ChaCha20, Poly1305) belong to P2-T2 and
# are deliberately not reachable from here.

[lints]
workspace = true
