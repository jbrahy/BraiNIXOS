[package]
name = "brainix-ipc-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Host-compilable IPC path shim for Prusti formal verification"

# This crate is excluded from bare-metal cargo check (same as capability-verify).
# It compiles on the host target only.
# prusti-contracts is NOT listed as a dependency here because the workspace uses
# vendored sources and the Prusti verifier supplies prusti-contracts via its own
# bundled environment (separate Docker image per D-08).
# Prusti annotations are guarded by #[cfg(prusti)] which is only set by the
# Prusti verifier itself, not by normal cargo builds.

[dependencies]

[lints]
workspace = true
