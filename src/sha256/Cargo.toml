[package]
name = "brainix-sha256"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "In-tree SHA-256, from FIPS 180-4, to retire the vendored sha2 (X-T4)"

[dependencies]

# Test-only, and the reason is the point: the vendored crate this one exists to
# retire is the differential oracle for it. When X-T4 removes `sha2` from the
# tree, this dev-dependency and its test go with it -- until then, agreeing with
# the implementation in production is a stronger check than agreeing with a
# handful of published vectors.
[dev-dependencies]
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }

[lints]
workspace = true
